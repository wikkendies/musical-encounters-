<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}</style>
<title>Let's Play Drums &middot; Musical Encounters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EAEEF5; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#16203A; --muted:#58637F;
  --line:#D3D9E6; --accent:#3257E0; --accent5:#D97F06;
  --shadow:0 1px 2px rgba(22,32,58,.06),0 10px 30px rgba(22,32,58,.08);
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0E1322;--surface:#161E33;--surface-2:#1C2640;--ink:#E6EAF5;--muted:#9BA6C3;
  --line:#2A3553;--accent:#8198FF;--accent5:#F5B84F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0E1322;--surface:#161E33;--surface-2:#1C2640;--ink:#E6EAF5;--muted:#9BA6C3;
  --line:#2A3553;--accent:#8198FF;--accent5:#F5B84F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:24px 56px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
.back{align-self:flex-start;color:var(--muted);font-weight:600;text-decoration:none}
.back:hover{color:var(--accent)}
.hero{text-align:center}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,7vw,60px);line-height:1;letter-spacing:-.03em;margin:0}
.hero p{margin:14px auto 0;max-width:46ch;color:var(--muted);font-size:18px}
.doors{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.door{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:260px;padding:26px 18px;border-radius:24px;text-decoration:none;color:var(--ink);background:var(--surface);box-shadow:var(--shadow);border:2px solid transparent;transition:transform .15s,border-color .15s}
.door:hover{transform:translateY(-4px)}
.door:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.door .icon{height:80px;display:flex;align-items:center}
.door .icon svg{height:80px;width:auto}
.door h2{font-family:var(--display);font-weight:800;font-size:25px;margin:0;letter-spacing:-.01em;text-align:center}
.door h2 span.hl{display:block}
.door p{margin:0;color:var(--muted);text-align:center;font-size:15px}
.door.drums:hover{border-color:var(--accent5)}
.door.drums .icon,.door.drums h2 span.hl{color:var(--accent5)}
.door.drums:hover{border-color:var(--accent5)}
.door.drums .icon,.door.drums h2 span.hl{color:var(--accent5)}
@media (max-width:560px){.doors{grid-template-columns:1fr}.door{min-height:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="spelen.html">&larr; Let's Play</a>
  <header class="hero">
    <h1>Let's Play <span style="color:var(--accent5)">Drums</span></h1>
    <p>Kies een oefening of maak je eigen beat.</p>
  </header>
  <nav class="doors" aria-label="Kies een onderdeel">
    <a class="door drums" href="rhythm-builder.html">
      <div class="icon"><svg viewBox="0 0 110 64" aria-hidden="true"><line x1="0" y1="40" x2="110" y2="40" stroke="currentColor" stroke-width="1.2" opacity=".4"/><ellipse cx="22" cy="40" rx="7.2" ry="5.3" transform="rotate(-20 22 40)" fill="currentColor"/><line x1="28.6" y1="38" x2="28.6" y2="8" stroke="currentColor" stroke-width="2"/><ellipse cx="62" cy="40" rx="7.2" ry="5.3" transform="rotate(-20 62 40)" fill="currentColor"/><line x1="68.6" y1="38" x2="68.6" y2="8" stroke="currentColor" stroke-width="2"/><ellipse cx="92" cy="40" rx="7.2" ry="5.3" transform="rotate(-20 92 40)" fill="currentColor"/><line x1="98.6" y1="38" x2="98.6" y2="8" stroke="currentColor" stroke-width="2"/></svg></div>
      <h2>Rhythm<span class="hl">Builder</span></h2>
      <p>Bouw een ritme met noten</p>
    </a>
    <a class="door drums" href="drum-detective.html">
      <div class="icon"><svg viewBox="0 0 110 64" aria-hidden="true"><ellipse cx="42" cy="34" rx="22" ry="7" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M20 34 V46 C20 50 30 53 42 53 C54 53 64 50 64 46 V34" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="82" cy="24" r="12" fill="none" stroke="currentColor" stroke-width="3"/><line x1="91" y1="33" x2="104" y2="48" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></div>
      <h2>Drum<span class="hl">Detective</span></h2>
      <p>Welk drumpatroon hoor je?</p>
    </a>
    <a class="door drums" href="tap-it-back.html">
      <div class="icon"><svg viewBox="0 0 110 64" aria-hidden="true"><path d="M20 52 V30 C20 26 26 26 26 30 V22 C26 18 32 18 32 22 V24 C32 20 38 20 38 24 V28 C38 24 44 24 44 28 V44 C44 52 38 56 32 56 H28 C22 56 20 54 20 52 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M60 22 q8 -8 16 0"/><path d="M66 30 q8 -8 16 0" opacity=".6"/><path d="M72 38 q8 -8 16 0" opacity=".35"/></g></svg></div>
      <h2>Tap<span class="hl">It Back</span></h2>
      <p>Tik het ritme na</p>
    </a>
    <a class="door drums" href="beat-maker.html">
      <div class="icon"><svg viewBox="0 0 110 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4"><rect x="8" y="10" width="20" height="20" rx="4"/><rect x="36" y="10" width="20" height="20" rx="4"/><rect x="64" y="10" width="20" height="20" rx="4"/><rect x="8" y="36" width="20" height="20" rx="4"/><rect x="36" y="36" width="20" height="20" rx="4"/><rect x="64" y="36" width="20" height="20" rx="4"/></g><g fill="currentColor"><rect x="38" y="12" width="16" height="16" rx="3"/><rect x="10" y="38" width="16" height="16" rx="3"/><rect x="66" y="38" width="16" height="16" rx="3"/></g></svg></div>
      <h2>Beat<span class="hl">Maker</span></h2>
      <p>Maak je eigen drumbeat</p>
    </a>
  </nav>
</div>
</body>
</html>
