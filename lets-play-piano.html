<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}</style>
<title>Let's Play Piano &middot; Musical Encounters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EAEEF5; --surface:#FFFFFF; --surface-2:#F3F5FA; --ink:#16203A; --muted:#58637F;
  --line:#D3D9E6; --accent:#3257E0; --accent5:#D97F06;
  --shadow:0 1px 2px rgba(22,32,58,.06),0 10px 30px rgba(22,32,58,.08);
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0E1322;--surface:#161E33;--surface-2:#1C2640;--ink:#E6EAF5;--muted:#9BA6C3;
  --line:#2A3553;--accent:#8198FF;--accent5:#F5B84F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0E1322;--surface:#161E33;--surface-2:#1C2640;--ink:#E6EAF5;--muted:#9BA6C3;
  --line:#2A3553;--accent:#8198FF;--accent5:#F5B84F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:24px 56px}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
.back{align-self:flex-start;color:var(--muted);font-weight:600;text-decoration:none}
.back:hover{color:var(--accent)}
.hero{text-align:center}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,7vw,60px);line-height:1;letter-spacing:-.03em;margin:0}
.hero p{margin:14px auto 0;max-width:46ch;color:var(--muted);font-size:18px}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.door{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:260px;padding:26px 18px;border-radius:24px;text-decoration:none;color:var(--ink);background:var(--surface);box-shadow:var(--shadow);border:2px solid transparent;transition:transform .15s,border-color .15s}
.door:hover{transform:translateY(-4px)}
.door:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.door .icon{height:80px;display:flex;align-items:center}
.door .icon svg{height:80px;width:auto}
.door h2{font-family:var(--display);font-weight:800;font-size:25px;margin:0;letter-spacing:-.01em;text-align:center}
.door h2 span.hl{display:block}
.door p{margin:0;color:var(--muted);text-align:center;font-size:15px}
.door.piano:hover{border-color:var(--accent)}
.door.piano .icon,.door.piano h2 span.hl{color:var(--accent)}
.door.drums:hover{border-color:var(--accent5)}
.door.drums .icon,.door.drums h2 span.hl{color:var(--accent5)}
@media (max-width:760px){.doors{grid-template-columns:1fr}.door{min-height:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="spelen.html">&larr; Let's Play</a>
  <header class="hero">
    <h1>Let's Play <span style="color:var(--accent)">Piano</span></h1>
    <p>Speel vrij of kies een oefening.</p>
  </header>
  <nav class="doors" aria-label="Kies een onderdeel">
    <a class="door piano" href="piano.html">
      <div class="icon"><svg viewBox="0 0 110 64" aria-hidden="true">
        <rect x="6" y="8" width="98" height="48" rx="5" fill="none" stroke="currentColor" stroke-width="2.6"/>
        <g stroke="currentColor" stroke-width="2"><line x1="26" y1="30" x2="26" y2="56"/><line x1="46" y1="30" x2="46" y2="56"/><line x1="66" y1="30" x2="66" y2="56"/><line x1="86" y1="30" x2="86" y2="56"/></g>
        <g fill="currentColor"><rect x="20" y="8" width="12" height="26" rx="2"/><rect x="40" y="8" width="12" height="26" rx="2"/><rect x="72" y="8" width="12" height="26" rx="2"/></g>
      </svg></div>
      <h2>Vrij<span class="hl">spelen</span></h2>
      <p>Toetsen &ndash; noten &ndash; melodie</p>
    </a>
    <a class="door piano" href="name-that-note.html">
      <div class="icon"><svg viewBox="0 0 110 64" aria-hidden="true"><g stroke="currentColor" stroke-width="1.4" opacity=".5"><line x1="8" y1="18" x2="102" y2="18"/><line x1="8" y1="28" x2="102" y2="28"/><line x1="8" y1="38" x2="102" y2="38"/><line x1="8" y1="48" x2="102" y2="48"/><line x1="8" y1="58" x2="102" y2="58"/></g><ellipse cx="40" cy="43" rx="8" ry="5.8" transform="rotate(-20 40 43)" fill="currentColor"/><line x1="47" y1="41" x2="47" y2="10" stroke="currentColor" stroke-width="2.4"/><text x="68" y="52" font-family="sans-serif" font-weight="800" font-size="30" fill="currentColor">?</text></svg></div>
      <h2>Name<span class="hl">That Note</span></h2>
      <p>Welke noot is dit?</p>
    </a>
    <a class="door piano" href="play-what-you-see.html">
      <div class="icon"><svg viewBox="0 0 110 64" aria-hidden="true"><g stroke="currentColor" stroke-width="1.4" opacity=".5"><line x1="6" y1="8" x2="104" y2="8"/><line x1="6" y1="15" x2="104" y2="15"/><line x1="6" y1="22" x2="104" y2="22"/></g><g fill="currentColor"><ellipse cx="22" cy="19" rx="5.5" ry="4" transform="rotate(-20 22 19)"/><ellipse cx="46" cy="12" rx="5.5" ry="4" transform="rotate(-20 46 12)"/><ellipse cx="70" cy="16" rx="5.5" ry="4" transform="rotate(-20 70 16)"/><ellipse cx="94" cy="8" rx="5.5" ry="4" transform="rotate(-20 94 8)"/></g><g fill="none" stroke="currentColor" stroke-width="2"><rect x="10" y="32" width="90" height="26" rx="4"/></g><g stroke="currentColor" stroke-width="2"><line x1="28" y1="44" x2="28" y2="58"/><line x1="46" y1="44" x2="46" y2="58"/><line x1="64" y1="44" x2="64" y2="58"/><line x1="82" y1="44" x2="82" y2="58"/></g></svg></div>
      <h2>Play What<span class="hl">You See</span></h2>
      <p>Lees de noten en speel ze na</p>
    </a>
  </nav>
</div>
</body>
</html>
